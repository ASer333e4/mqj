<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="description" content="متجر تطبيقات مجانية - قناة تطبيقات مجانية على تليجرام" />
    <title>🚀 متجر تطبيقات مجانية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        /* --- إعادة الضبط --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f4f7fc;
            color: #1a1e2b;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            animation: fadeSlide 0.6s ease-out;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- الهيدر --- */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eef2f7;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-area h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(145deg, #0f172a, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-area span {
            font-size: 2.2rem;
        }

        .telegram-badge {
            background: #0088cc;
            color: #fff;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.25);
        }

        .telegram-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.35);
        }

        /* --- الشبكة (Grid) --- */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin: 2.5rem 0 1.5rem;
        }

        /* --- بطاقة التطبيق --- */
        .app-card {
            background: #f9faff;
            border-radius: 24px;
            padding: 1.5rem 1.2rem 1.2rem;
            border: 1px solid #e9edf4;
            transition: 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .app-card:hover {
            transform: translateY(-6px);
            border-color: #b3c9ff;
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.08);
            background: #ffffff;
        }

        .app-card .app-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #0f172a;
        }

        .app-card .app-desc {
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.6rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .app-card .app-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 0.8rem;
            margin: 0.5rem 0 0.9rem;
            font-size: 0.8rem;
            background: #eef2f7;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            color: #1e293b;
        }

        .app-card .app-meta .key {
            background: #3b82f6;
            color: #fff;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .btn-download {
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            margin-top: 0.2rem;
            border: 1px solid transparent;
            width: 100%;
        }

        .btn-download:hover {
            background: #1e293b;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
        }

        .btn-download.mediafire {
            background: #e54b2b;
        }
        .btn-download.mediafire:hover {
            background: #c73d1f;
        }

        .btn-download.vpn {
            background: #10b981;
        }
        .btn-download.vpn:hover {
            background: #059669;
        }

        .btn-download.tv {
            background: #7c3aed;
        }
        .btn-download.tv:hover {
            background: #6d28d9;
        }

        .btn-download.player {
            background: #334155;
        }
        .btn-download.player:hover {
            background: #1e293b;
        }

        /* --- المودال (النافذة المنبثقة) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-box {
            background: #ffffff;
            max-width: 440px;
            width: 90%;
            padding: 2rem 1.8rem;
            border-radius: 32px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: scaleUp 0.3s ease-out;
            position: relative;
        }

        @keyframes scaleUp {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-box .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .modal-box h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .modal-box p {
            color: #475569;
            font-size: 1rem;
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }

        .modal-box .channel-name {
            background: #eef2f7;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            color: #0088cc;
            font-size: 1.1rem;
            display: inline-block;
            margin: 0.5rem auto 1.2rem;
            direction: ltr;
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .modal-actions .btn-modal {
            padding: 0.7rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            min-width: 120px;
        }

        .btn-modal.subscribe {
            background: #0088cc;
            color: #fff;
        }
        .btn-modal.subscribe:hover {
            background: #006699;
            transform: scale(1.03);
        }

        .btn-modal.later {
            background: #e9edf4;
            color: #1a1e2b;
        }
        .btn-modal.later:hover {
            background: #d1d8e0;
            transform: scale(1.03);
        }

        .btn-modal.close-modal {
            background: transparent;
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            min-width: auto;
        }
        .btn-modal.close-modal:hover {
            color: #475569;
        }

        /* --- الفوتر --- */
        .footer {
            margin-top: 2.5rem;
            padding-top: 1.2rem;
            border-top: 2px solid #eef2f7;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        /* --- استجابة للشاشات الصغيرة --- */
        @media (max-width: 600px) {
            body { padding: 0.8rem; }
            .container { padding: 1.2rem; border-radius: 24px; }
            .logo-area h1 { font-size: 1.4rem; }
            .telegram-badge { font-size: 0.75rem; padding: 0.3rem 1rem; }
            .apps-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .modal-box { padding: 1.5rem; }
            .modal-box h2 { font-size: 1.3rem; }
            .modal-actions .btn-modal { min-width: 100px; padding: 0.6rem 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- الهيدر -->
    <header class="header">
        <div class="logo-area">
            <span>🚀</span>
            <h1>متجر تطبيقات مجانية</h1>
        </div>
        <a href="https://t.me/X_9_KK" target="_blank" rel="noopener" class="telegram-badge">
            📢 انضم للقناة
        </a>
    </header>

    <!-- شبكة التطبيقات -->
    <div class="apps-grid" id="appsGrid">
        <!-- جميع البطاقات تم إنشاؤها عبر JavaScript للحفاظ على نظافة الكود وتسهيل التحديث -->
    </div>

    <!-- الفوتر -->
    <footer class="footer">
        🚀 متجر تطبيقات مجانية - جميع الحقوق محفوظة © 2026
        <br />
        <a href="https://t.me/X_9_KK" target="_blank" rel="noopener">@X_9_KK</a>
    </footer>

</div>

<!-- --- المودال (النافذة المنبثقة) --- -->
<div class="modal-overlay" id="subscribeModal">
    <div class="modal-box">
        <div class="modal-icon">📢</div>
        <h2>هل تريد الاشتراك بالقناة؟</h2>
        <p>احصل على أحدث التطبيقات والتحديثات أولاً بأول</p>
        <div class="channel-name">@X_9_KK</div>
        <div class="modal-actions">
            <button class="btn-modal subscribe" id="modalSubscribe">✅ اشتراك</button>
            <button class="btn-modal later" id="modalLater">⏳ لاحقًا</button>
        </div>
        <div style="margin-top: 1rem;">
            <button class="btn-modal close-modal" id="modalClose">إلغاء</button>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // --- بيانات التطبيقات (كل تطبيق مع رابط التحميل الخاص به) ---
        const appsData = [
            { title: '🎬 King Cinema', desc: 'أفلام، مسلسلات، بث مباشر للمباريات', meta: '📦 APK', link: '#', class: '' },
            { title: '📡 سينمانا', desc: 'للمشتركين ايرثلنك و الوطني FTTH', meta: '📦 APK', link: '#', class: '' },
            { title: '📡 تطبيق سي (C)', desc: 'سينمانا لجميع مزودي الإنترنت في العراق', meta: '📦 APK', link: '#', class: '' },
            { title: '⚡ FAST', desc: 'قياس سرعة الإنترنت في الشاشة', meta: '📦 APK', link: '#', class: '' },
            { title: '🎌 تطبيق الأنمي', desc: 'انقل حسابك من Anime Reeft إلى الشاشة', meta: '📦 APK', link: '#', class: '' },
            { title: '📺 Nado TV', desc: 'لجميع أنواع الإنترنت', meta: '🔑 22455  📦 APK', link: '#', class: '' },
            { title: '🖥️ Plasma 4K', desc: 'جودة عالية', meta: '📦 APK', link: '#', class: '' },
            { title: '🧩 ريزن', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire' },
            { title: '📺 كايدن TV', desc: 'نسخة MediaFire', meta: '🔑 19  📦 APK (MediaFire)', link: '#', class: 'mediafire' },
            { title: '🏆 Oscar TV', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv' },
            { title: '📱 KT PLUS', desc: 'نسخة APK', meta: '🔑 6666  📦 APK', link: '#', class: '' },
            { title: '🛡️ VPNify', desc: 'لتجاوز مشاكل فتح التطبيقات', meta: '📦 VPN', link: '#', class: 'vpn' },
            { title: '📺 Original TV', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire' },
            { title: '📡 GENRAL TV', desc: 'لا يحتاج مشغل ولا كود', meta: '📦 APK', link: '#', class: '' },
            { title: '📺 Nova TV', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv' },
            { title: '⚽ كوديا سبورت', desc: 'للإنترنت الضعيف والمتوسط | جودة HD', meta: '📦 APK', link: '#', class: '' },
            { title: '🎞️ Prom', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire' },
            { title: '📺 LIVE STREAM PREMIUM', desc: 'نسخة Premium', meta: '🔑 2027  📦 Premium | APK', link: '#', class: '' },
            { title: '👑 الباشا تي في', desc: 'أفضل تطبيق بالشرق الأوسط، SD/HD/UHD 4K', meta: '📦 APK', link: '#', class: '' },
            { title: '🥇 Yacine TV Gold', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv' },
            { title: '🌈 Alwan Sports', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire' }
        ];

        // --- بيانات إضافية للتطبيقات التي لها أزرار إضافية (مثل المشغل) ---
        // سيتم التعامل معها يدوياً في بناء البطاقات

        // --- عناصر المودال ---
        const modalOverlay = document.getElementById('subscribeModal');
        const modalSubscribeBtn = document.getElementById('modalSubscribe');
        const modalLaterBtn = document.getElementById('modalLater');
        const modalCloseBtn = document.getElementById('modalClose');
        let pendingDownloadLink = '#';  // يحفظ رابط التحميل المعلق

        // --- وظائف المودال ---
        function openModal(link) {
            pendingDownloadLink = link;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // منع تمرير الخلفية
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function startDownload() {
            if (pendingDownloadLink && pendingDownloadLink !== '#') {
                window.open(pendingDownloadLink, '_blank');
            } else {
                // إذا كان الرابط "#" نعرض رسالة تجريبية أو ننبه المستخدم
                alert('⚠️ رابط التحميل سيتم إضافته قريباً.');
            }
            closeModal();
        }

        // --- أحداث المودال ---
        modalSubscribeBtn.addEventListener('click', function() {
            // توجيه المستخدم إلى القناة
            window.open('https://t.me/X_9_KK', '_blank');
            // ثم نبدأ التحميل
            startDownload();
        });

        modalLaterBtn.addEventListener('click', function() {
            // يبدأ التحميل فوراً دون اشتراك
            startDownload();
        });

        modalCloseBtn.addEventListener('click', closeModal);

        // إغلاق المودال عند النقر خارج النافذة
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // إغلاق المودال بالضغط على Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // --- بناء بطاقات التطبيقات ديناميكياً ---
        const grid = document.getElementById('appsGrid');
        grid.innerHTML = ''; // تفريغ الشبكة

        appsData.forEach((app, index) => {
            const card = document.createElement('div');
            card.className = 'app-card';

            // العنوان
            const titleEl = document.createElement('div');
            titleEl.className = 'app-title';
            titleEl.textContent = app.title;
            card.appendChild(titleEl);

            // الوصف
            const descEl = document.createElement('div');
            descEl.className = 'app-desc';
            descEl.textContent = app.desc;
            card.appendChild(descEl);

            // الميتا (المعلومات الإضافية)
            const metaEl = document.createElement('div');
            metaEl.className = 'app-meta';
            // معالجة النص لعرض الأكواد بشكل مميز
            let metaText = app.meta;
            // إذا كان هناك كود تفعيل، نستخرجه ونضيف له وسماً
            const keyMatch = metaText.match(/🔑\s*(\d+)/);
            if (keyMatch) {
                const key = keyMatch[1];
                metaText = metaText.replace(/🔑\s*\d+/, '🔑 <span class="key">' + key + '</span>');
            }
            metaEl.innerHTML = metaText;
            card.appendChild(metaEl);

            // زر التحميل الرئيسي
            const btn = document.createElement('button');
            btn.className = 'btn-download' + (app.class ? ' ' + app.class : '');
            btn.textContent = '⬇️ تنزيل التطبيق';
            // نستخدم حدث النقر لفتح المودال
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                // نمرر رابط التحميل إلى المودال
                openModal(app.link);
            });
            card.appendChild(btn);

            // --- أزرار إضافية لبعض التطبيقات (مثل مشغل Oscar TV و Original TV) ---
            if (app.title.includes('Oscar TV')) {
                const playerBtn = document.createElement('button');
                playerBtn.className = 'btn-download player';
                playerBtn.textContent = '▶️ تحميل المشغل (بدون إعلانات)';
                playerBtn.style.marginTop = '0.4rem';
                playerBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('#'); // يمكنك تغيير الرابط لرابط المشغل
                });
                card.appendChild(playerBtn);
            }

            if (app.title.includes('Original TV')) {
                const playerBtn = document.createElement('button');
                playerBtn.className = 'btn-download player';
                playerBtn.textContent = '▶️ تنزيل مشغل أورجينال';
                playerBtn.style.marginTop = '0.4rem';
                playerBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('#'); // يمكنك تغيير الرابط لرابط المشغل
                });
                card.appendChild(playerBtn);
            }

            grid.appendChild(card);
        });

        console.log('[الخبز] تم تحميل المتجر بالكامل مع مودال الاشتراك الذكي.');
    })();
</script>

</body>
    </html>
