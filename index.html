<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="description" content="متجر تطبيقات مجانية - قناة تطبيقات مجانية على تليجرام" />
    <title>🚀 متجر تطبيقات مجانية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #4F2DA8;
            --primary-light: #8B6CE6;
            --secondary: #00D4FF;
            --accent: #FF6B6B;
            --bg: #0B0E1A;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-primary: #F0F4FF;
            --text-secondary: #A0AEC0;
            --glass: rgba(255, 255, 255, 0.03);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius: 24px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(108, 60, 225, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(108, 60, 225, 0.05) 0%, transparent 40%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1280px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 2.5rem 2.2rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            animation: fadeSlide 0.7s ease-out;
            position: relative;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* الهيدر */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .logo-area .logo-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            box-shadow: 0 8px 28px rgba(108, 60, 225, 0.35);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 28px rgba(108, 60, 225, 0.35); }
            50% { box-shadow: 0 8px 35px rgba(108, 60, 225, 0.55); }
        }

        .logo-area h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #A0AEC0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-area h1 span {
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .telegram-badge {
            background: linear-gradient(135deg, #0088cc, #005f8a);
            color: #fff;
            padding: 0.7rem 1.9rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 4px 18px rgba(0, 136, 204, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .telegram-badge:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 32px rgba(0, 136, 204, 0.45);
        }

        /* شريط البحث والفلاتر */
        .controls {
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.2rem 1rem 3.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.15);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box i {
            position: absolute;
            right: 1.3rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #fff;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(108, 60, 225, 0.3);
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .results-count span {
            color: var(--secondary);
            font-weight: 700;
        }

        /* شبكة التطبيقات */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.8rem;
            margin: 1.5rem 0;
            min-height: 200px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 1.7rem 1.5rem 1.4rem;
            border: 1px solid var(--card-border);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.08), rgba(0, 212, 255, 0.03));
            opacity: 0;
            transition: var(--transition);
            border-radius: var(--radius);
            pointer-events: none;
        }

        .app-card:hover {
            transform: translateY(-10px);
            border-color: rgba(108, 60, 225, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.07);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .app-card .app-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.25), rgba(0, 212, 255, 0.12));
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-card .app-title {
            font-size: 1.28rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
            color: #FFFFFF;
        }

        .app-card .app-desc {
            font-size: 0.87rem;
            color: var(--text-secondary);
            margin-bottom: 0.7rem;
            line-height: 1.65;
            flex-grow: 1;
        }

        .app-card .app-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin: 0.4rem 0 1.1rem;
            font-size: 0.78rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.45rem 0.95rem;
            border-radius: 40px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-card .app-meta .key {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 0.15rem 0.75rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .app-card .app-meta .key:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(108, 60, 225, 0.4);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 0.85rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            position: relative;
            z-index: 1;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-download:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 28px rgba(108, 60, 225, 0.4);
        }

        .btn-download:active {
            transform: scale(0.97);
        }

        .btn-download.mediafire {
            background: linear-gradient(135deg, #E54B2B, #C73D1F);
        }
        .btn-download.mediafire:hover {
            box-shadow: 0 10px 28px rgba(229, 75, 43, 0.4);
        }

        .btn-download.vpn {
            background: linear-gradient(135deg, #10B981, #059669);
        }
        .btn-download.vpn:hover {
            box-shadow: 0 10px 28px rgba(16, 185, 129, 0.4);
        }

        .btn-download.tv {
            background: linear-gradient(135deg, #7C3AED, #6D28D9);
        }
        .btn-download.tv:hover {
            box-shadow: 0 10px 28px rgba(124, 58, 237, 0.4);
        }

        .btn-download.player {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            margin-top: 0.55rem;
        }
        .btn-download.player:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            box-shadow: none;
        }

        /* لا توجد نتائج */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        /* المودال */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: linear-gradient(145deg, rgba(20, 24, 40, 0.97), rgba(11, 14, 26, 0.99));
            backdrop-filter: blur(30px);
            max-width: 460px;
            width: 92%;
            padding: 2.6rem 2rem;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65);
            text-align: center;
            animation: scaleUp 0.35s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9) translateY(15px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-box .modal-icon {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.25), rgba(0, 212, 255, 0.12));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.9rem;
            margin: 0 auto 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-box h2 {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .modal-box p {
            color: var(--text-secondary);
            font-size: 1.02rem;
            margin-bottom: 0.9rem;
            line-height: 1.7;
        }

        .modal-box .channel-name {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.65rem 1.6rem;
            border-radius: 60px;
            font-weight: 700;
            color: #00D4FF;
            font-size: 1.15rem;
            display: inline-block;
            margin: 0.3rem auto 1.5rem;
            direction: ltr;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }

        .btn-modal {
            padding: 0.85rem 2.3rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 135px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-modal.subscribe {
            background: linear-gradient(135deg, #0088cc, #005f8a);
            color: #fff;
            box-shadow: 0 4px 18px rgba(0, 136, 204, 0.3);
        }
        .btn-modal.subscribe:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(0, 136, 204, 0.4);
        }

        .btn-modal.later {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-modal.later:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }

        .btn-modal.close-modal {
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            min-width: auto;
            margin-top: 0.8rem;
        }
        .btn-modal.close-modal:hover {
            color: #fff;
        }

        /* إشعار النسخ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(108, 60, 225, 0.4);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* زر العودة للأعلى */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(108, 60, 225, 0.4);
            z-index: 100;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-4px) scale(1.08);
        }

        /* الفوتر */
        .footer {
            margin-top: 3rem;
            padding-top: 1.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .footer a:hover {
            color: #fff;
        }

        /* سكرول بار */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

        /* استجابة */
        @media (max-width: 640px) {
            body { padding: 0.7rem; }
            .container { padding: 1.3rem 1rem; border-radius: 20px; }
            .logo-area .logo-icon { width: 42px; height: 42px; font-size: 1.5rem; }
            .logo-area h1 { font-size: 1.35rem; }
            .telegram-badge { font-size: 0.8rem; padding: 0.5rem 1.3rem; }
            .apps-grid { grid-template-columns: 1fr; gap: 1.3rem; }
            .app-card { padding: 1.3rem 1.1rem; }
            .modal-box { padding: 2rem 1.3rem; }
            .modal-box h2 { font-size: 1.35rem; }
            .btn-modal { min-width: 110px; padding: 0.7rem 1.3rem; font-size: 0.92rem; }
            .back-to-top { left: 20px; bottom: 20px; width: 46px; height: 46px; }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .apps-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

    <script>

                { title: 'Oscar TV', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv', icon: '🏆', tags: ['tv'] },

                { title: 'Original TV', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire', icon: '📺', tags: ['tv', 'mediafire'] },

                { title: 'Nova TV', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv', icon: '📺', tags: ['tv'] },
                { title: 'كوديا سبورت', desc: 'للإنترنت الضعيف والمتوسط | جودة HD', meta: '📦 APK', link: '#', class: '', icon: '⚽', tags: ['sport'] },
                { title: 'Prom', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire', icon: '🎞️', tags: ['mediafire'] },
                { title: 'LIVE STREAM PREMIUM', desc: 'نسخة Premium', meta: '🔑 2027  📦 Premium | APK', link: '#', class: '', icon: '📺', tags: ['tv'] },
                { title: 'الباشا تي في', desc: 'أفضل تطبيق بالشرق الأوسط، SD/HD/UHD 4K', meta: '📦 APK', link: '#', class: '', icon: '👑', tags: ['tv'] },
                { title: 'Yacine TV Gold', desc: 'نسخة TV | APK', meta: '📦 TV | APK', link: '#', class: 'tv', icon: '🥇', tags: ['tv'] },
                { title: 'Alwan Sports', desc: 'نسخة MediaFire', meta: '📦 APK (MediaFire)', link: '#', class: 'mediafire', icon: '🌈', tags: ['sport', 'mediafire'] }
            ];

            // عناصر DOM
            const grid = document.getElementById('appsGrid');
            const searchInput = document.getElementById('searchInput');
            const resultsCount = document.getElementById('resultsCount');
            const filtersContainer = document.getElementById('filters');
            const modalOverlay = document.getElementById('subscribeModal');
            const toast = document.getElementById('toast');
            const backToTop = document.getElementById('backToTop');

            let currentFilter = localStorage.getItem('appFilter') || 'all';
            let pendingDownloadLink = '#';

            // تفعيل الفلتر المحفوظ
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === currentFilter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // --- وظائف المودال ---
            function openModal(link) {
                pendingDownloadLink = link;
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function startDownload() {
                if (pendingDownloadLink && pendingDownloadLink !== '#') {
                    window.open(pendingDownloadLink, '_blank');
                } else {
                    showToast('⚠️ رابط التحميل سيتم إضافته قريباً');
                }
                closeModal();
            }

            // أحداث المودال
            document.getElementById('modalSubscribe').addEventListener('click', () => {
                window.open('https://t.me/X_9_KK', '_blank');
                startDownload();
            });
            document.getElementById('modalLater').addEventListener('click', startDownload);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', e => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
            });

            // --- إشعار النسخ ---
            function showToast(message = 'تم نسخ الكود بنجاح!') {
                toast.querySelector('span').textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // --- بناء البطاقات ---
            function renderApps(apps) {
                grid.innerHTML = '';
                resultsCount.textContent = apps.length;

                if (apps.length === 0) {
                    grid.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search"></i>
                            <p>لا توجد تطبيقات مطابقة لبحثك</p>
                        </div>
                    `;
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';

                    // الأيقونة
                    const iconEl = document.createElement('div');
                    iconEl.className = 'app-icon';
                    iconEl.textContent = app.icon || '📦';
                    card.appendChild(iconEl);

                    // العنوان
                    const titleEl = document.createElement('div');
                    titleEl.className = 'app-title';
                    titleEl.textContent = app.title;
                    card.appendChild(titleEl);

                    // الوصف
                    const descEl = document.createElement('div');
                    descEl.className = 'app-desc';
                    descEl.textContent = app.desc;
                    card.appendChild(descEl);

                    // الميتا + زر نسخ الكود
                    const metaEl = document.createElement('div');
                    metaEl.className = 'app-meta';
                    let metaText = app.meta;
                    const keyMatch = metaText.match(/🔑\s*(\d+)/);
                    if (keyMatch) {
                        const key = keyMatch[1];
                        metaText = metaText.replace(/🔑\s*\d+/, `🔑 <span class="key" title="انقر لنسخ الكود" data-key="${key}">${key}</span>`);
                    }
                    metaEl.innerHTML = metaText;
                    card.appendChild(metaEl);

                    // زر التحميل
                    const btn = document.createElement('button');
                    btn.className = 'btn-download' + (app.class ? ' ' + app.class : '');
                    btn.innerHTML = '<i class="fas fa-download"></i> تنزيل التطبيق';
                    btn.addEventListener('click', e => {
                        e.preventDefault();
                        openModal(app.link);
                    });
                    card.appendChild(btn);

                    // أزرار إضافية
                    if (app.title.includes('Oscar TV')) {
                        const playerBtn = document.createElement('button');
                        playerBtn.className = 'btn-download player';
                        playerBtn.innerHTML = '<i class="fas fa-play"></i> تحميل المشغل (بدون إعلانات)';
                        playerBtn.addEventListener('click', e => {
                            e.preventDefault();
                            openModal('#');
                        });
                        card.appendChild(playerBtn);
                    }

                    if (app.title.includes('Original TV')) {
                        const playerBtn = document.createElement('button');
                        playerBtn.className = 'btn-download player';
                        playerBtn.innerHTML = '<i class="fas fa-play"></i> تنزيل مشغل أورجينال';
                        playerBtn.addEventListener('click', e => {
                            e.preventDefault();
                            openModal('#');
                        });
                        card.appendChild(playerBtn);
                    }

                    grid.appendChild(card);
                });

                // أحداث نسخ الكود
                document.querySelectorAll('.key').forEach(el => {
                    el.addEventListener('click', () => {
                        const key = el.dataset.key;
                        navigator.clipboard.writeText(key).then(() => {
                            showToast(`تم نسخ الكود: ${key}`);
                        }).catch(() => {
                            showToast('فشل النسخ، انسخ يدوياً');
                        });
                    });
                });
            }

            // --- الفلترة والبحث ---
            function filterAndSearch() {
                const query = searchInput.value.trim().toLowerCase();
                let filtered = appsData;

                // فلتر التصنيف
                if (currentFilter !== 'all') {
                    filtered = filtered.filter(app => app.tags.includes(currentFilter));
                }

                // البحث
                if (query) {
                    filtered = filtered.filter(app => 
                        app.title.toLowerCase().includes(query) ||
                        app.desc.toLowerCase().includes(query) ||
                        app.meta.toLowerCase().includes(query)
                    );
                }

                renderApps(filtered);
            }

            // أحداث الفلتر
            filtersContainer.addEventListener('click', e => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    localStorage.setItem('appFilter', currentFilter);
                    filterAndSearch();
                }
            });

            // حدث البحث
            searchInput.addEventListener('input', filterAndSearch);

            // زر العودة للأعلى
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });

            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // التحميل الأولي
            filterAndSearch();

            console.log('[الخبز] تم تحميل المتجر الفخم المطوّر بالكامل 🚀');
        })();
    </script>
